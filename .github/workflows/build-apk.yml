name: Build Android APK

# Builds a debug APK on GitHub's runners and publishes it as a downloadable
# artifact. Runs on their hardware, not a local sandbox, so it is reproducible
# and unaffected by whatever machine we happen to be working on.
#
# TO GET THE APK ON YOUR PHONE:
#   Easiest: repo -> releases/terrastep-debug.apk -> download -> tap.
#   Or from this workflow:
#   1. GitHub app or browser -> repo -> Actions tab
#   2. Open the newest "Build Android APK" run
#   3. Scroll to Artifacts -> tap "terrastep-debug-apk" -> downloads a .zip
#   4. Unzip on the phone, tap the .apk, allow "install unknown apps"
#
# IF IT FAILS: the job summary page shows the error without opening logs.
# A full build log is also uploaded as the "build-logs" artifact.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # trigger a build by hand from the Actions tab

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned, not floating 'stable'. The first build failed because open
      # carets resolved plugins needing a newer Flutter than the runner had
      # (ISSUES_LOG #22). A moving toolchain plus moving deps means a build
      # that works today can break tomorrow with no commit in between.
      # 3.24.5 has Dart 3.5.4 and cannot resolve h3_flutter 0.7.x
      # (h3_web needs Dart 3.6). 3.27.4 is the oldest pin that can.
      # See ISSUES_LOG #23.
      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version 2>&1

      # `flutter create` regenerates platform folders from a template. It can
      # also rewrite pubspec.yaml, so it is preserved explicitly.
      - name: Generate Android platform files
        working-directory: app
        run: |
          cp pubspec.yaml /tmp/pubspec.backup
          flutter create --platforms=android \
            --org io.terrastep --project-name terrastep . 2>&1 | tail -20
          cp /tmp/pubspec.backup pubspec.yaml
          rm -f test/widget_test.dart
          echo "--- android/ generated ---"
          ls android/app/src/main/

      - name: Apply Android manifest permissions
        working-directory: app
        run: |
          bash ../scripts/patch_android_manifest.sh
          echo "--- manifest ---"
          cat android/app/src/main/AndroidManifest.xml

      - name: Resolve core package
        working-directory: packages/terrastep_core
        run: dart pub get

      - name: Resolve app dependencies
        id: pubget
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/pubget.log

      - name: Resolved dependency versions
        working-directory: app
        run: flutter pub deps --style=compact 2>&1 | head -40

      # Non-blocking: analyzer complaints should not stop us finding out
      # whether the APK actually compiles. Real errors surface in the build.
      - name: Analyze
        continue-on-error: true
        working-directory: app
        run: flutter analyze 2>&1 | tail -40

      - name: Build debug APK
        id: build
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.log

      - name: Package APK
        working-directory: app
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "../dist/terrastep-debug-${{ github.run_number }}.apk"
          ls -lh ../dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terrastep-debug-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # ---- diagnostics -----------------------------------------------------

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/pubget.log
            /tmp/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Success summary
        if: success()
        run: |
          {
            echo "### ✅ APK ready"
            echo ""
            echo "**Download:** Artifacts below → \`terrastep-debug-apk\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | #${{ github.run_number }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Size | $(du -h dist/*.apk | cut -f1) |"
            echo ""
            echo "Install: unzip, tap the .apk, allow install from unknown sources."
            echo ""
            echo "**Test with the screen ON and the app open** — this build has"
            echo "no foreground service yet, so tracking stops when backgrounded."
            echo "Walk ~120 steps in one hex and watch it fill."
          } >> "$GITHUB_STEP_SUMMARY"

      # Puts the actual error on the summary page, so it can be read (and
      # screenshotted) without opening the raw logs.
      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### ❌ Build failed"
            echo ""
            if [ -f /tmp/pubget.log ] && grep -qi "version solving failed\|because\|conflict" /tmp/pubget.log; then
              echo "#### Dependency resolution"
              echo '```'
              tail -40 /tmp/pubget.log
              echo '```'
            fi
            if [ -f /tmp/build.log ]; then
              echo "#### Build output (last 60 lines)"
              echo '```'
              tail -60 /tmp/build.log
              echo '```'
            fi
            echo ""
            echo "Full logs: \`build-logs\` artifact below."
          } >> "$GITHUB_STEP_SUMMARY"
